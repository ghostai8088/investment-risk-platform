# O-D4 was REMOVED, and the reason is a real limit of this harness rather than a gap in the
# control. The mutant deleted `ALTER TABLE ... FORCE ROW LEVEL SECURITY` from migration 0068 —
# but the battery runs pytest against an ALREADY-MIGRATED database, so mutating migration DDL
# changes nothing any test can observe. It survived every time, and a permanent survivor teaches
# a battery's readers to ignore survivors.
#
# The property itself IS asserted: `test_tenancy_floors_pg.py` floor 2 walks every tenant_id-
# bearing ORM table and requires both RLS-enabled and FORCE-enabled, so ENT-075 is covered the
# moment it exists — verified directly at build time (relrowsecurity=True, relforcerowsecurity=
# True, policy `tenant_isolation_entitlement_request` present).
