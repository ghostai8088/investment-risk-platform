        run: pytest packages/shared-python/tests/test_demo_stage9zzzzzzzzzzzzzzz_repro2_pg.py -q
      # STRUCT-1 stage 25 (REQ-PPM-006): the demonstrating bond in its OWN DEMO-FI book — two
      # measures from one holding, hand amounts, and the widened 0071 key proven by the live
      # PostgreSQL constraint. Runs after stage 24 (alpha-sort; a new book, so it moves no golden).
      - name: Demo stage 25 (Postgres, STRUCT-1 — the two-measure demonstrating bond)
