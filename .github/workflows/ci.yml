      # FINAL-POSITION pin now lives in stage 23 (LQ-1, 27/44/141). Close-review L8, folded:
      # the present-tense claim and the STEP NAME below both still said final-position, and a
      # step name is visible in the CI UI — a stale relay baton read as the live one.
      - name: Demo stage 19 (Postgres, CON-1 concentration — intermediate count pin)
        env:
          DATABASE_URL: postgresql+psycopg://irp:irp@localhost:5432/irp
          IRP_TEST_DATABASE_URL: postgresql+psycopg://irp:irp@localhost:5432/irp
        run: pytest packages/shared-python/tests/test_demo_stage9zzzzzzzzzz_con1_pg.py -q
      # LIM-2 held the pin unchanged (26/41/136); the pin relayed onward at CAL-1b (26/43/139) and
      # now rests at stage 23 (LQ-1, 27/44/141): limits and
      # breaches are neither model codes, validations, nor calculation runs, so a whole slice must
      # move none of them. Filename carries ELEVEN `z` (con1 = ten) per the stage-ordering rule.
      - name: Demo stage 20 (Postgres, LIM-2 concentration limits)
        env:
          DATABASE_URL: postgresql+psycopg://irp:irp@localhost:5432/irp
          IRP_TEST_DATABASE_URL: postgresql+psycopg://irp:irp@localhost:5432/irp
        run: pytest packages/shared-python/tests/test_demo_stage9zzzzzzzzzzz_lim2_pg.py -q
      - name: Demo stage 21 (Postgres, CAL-1b holiday-aware convention — positional count pin)
        env:
          DATABASE_URL: postgresql+psycopg://irp:irp@localhost:5432/irp
          IRP_TEST_DATABASE_URL: postgresql+psycopg://irp:irp@localhost:5432/irp
        run: pytest packages/shared-python/tests/test_demo_stage9zzzzzzzzzzzz_cal1b_pg.py -q
      - name: Demo stage 22 (Postgres, DATA-1 real TB3MS capture — positional count pin)
        env:
          DATABASE_URL: postgresql+psycopg://irp:irp@localhost:5432/irp
          IRP_TEST_DATABASE_URL: postgresql+psycopg://irp:irp@localhost:5432/irp
        run: pytest packages/shared-python/tests/test_demo_stage9zzzzzzzzzzzzz_data1_pg.py -q
      - name: Liquidity result RLS + append-only (Postgres)
        env:
          DATABASE_URL: postgresql+psycopg://irp:irp@localhost:5432/irp
          IRP_TEST_DATABASE_URL: postgresql+psycopg://irp:irp@localhost:5432/irp
        run: pytest packages/shared-python/tests/test_liquidity_pg.py -q
      - name: Demo stage 23 (Postgres, LQ-1 liquidity tiers — FINAL-POSITION count pin)
        env:
          DATABASE_URL: postgresql+psycopg://irp:irp@localhost:5432/irp
          IRP_TEST_DATABASE_URL: postgresql+psycopg://irp:irp@localhost:5432/irp
        run: pytest packages/shared-python/tests/test_demo_stage9zzzzzzzzzzzzzz_lq1_pg.py -q
      # REPRO-2 stage 24 runs AFTER stage 23 and after every other demo stage — the alpha-sort
      # convention, and here it is load-bearing rather than tidy: this stage seeds a REPRODUCTION
      # schedule into the shared demo tenant, and a schedule present earlier makes stage 15's tick
      # dispatch two where it asserts one. It also sweeps the whole seeded book, which is the only
      # place the sixteen new adapters meet data they did not choose.
      - name: Demo stage 24 (Postgres, REPRO-2 — discoverable tenant + full 19-family sweep)
