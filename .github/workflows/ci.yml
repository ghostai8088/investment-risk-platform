        run: pytest packages/shared-python/tests/test_demo_stage9zzzzzzzzzzzzzzzz_struct1_pg.py -q
      # STRUCT-3 stage 26: the three-level book — the rollup identity, the sleeve-rooted chain,
      # the as-of tree from the ENT-076 history, and the rename carry (fresh re-runs
      # value-identical). Runs after stage 25 (alpha-sort; its own book moves no golden).
      - name: Demo stage 26 (Postgres, STRUCT-3 — the three-level book + rename carry)
        env:
          DATABASE_URL: postgresql+psycopg://irp:irp@localhost:5432/irp
          IRP_TEST_DATABASE_URL: postgresql+psycopg://irp:irp@localhost:5432/irp
        run: pytest packages/shared-python/tests/test_demo_stage9zzzzzzzzzzzzzzzzz_struct3_pg.py -q
      # STRUCT-4 stage 27: the three-currency book — DP-11 resolution live (root EUR / foreign
      # node USD / inherited EUR), the hand oracle at the foreign-reporting node, the stated
      # pivot on persisted bytes, the rollup translation, and the return-chain rename carry.
      # Runs after stage 26 (alpha-sort; its own book moves no golden).
      - name: Demo stage 27 (Postgres, STRUCT-4 — the three-currency book + FX visible)
        env:
          DATABASE_URL: postgresql+psycopg://irp:irp@localhost:5432/irp
          IRP_TEST_DATABASE_URL: postgresql+psycopg://irp:irp@localhost:5432/irp
        run: pytest packages/shared-python/tests/test_demo_stage9zzzzzzzzzzzzzzzzzz_struct4_pg.py -q
      - name: Report generation RLS + append-only + unique-key non-vacuity (Postgres)
        env:
          DATABASE_URL: postgresql+psycopg://irp:irp@localhost:5432/irp
          IRP_TEST_DATABASE_URL: postgresql+psycopg://irp:irp@localhost:5432/irp
        run: pytest packages/shared-python/tests/test_report_pg.py -q
      - name: Reproduction check RLS + append-only + unique-key non-vacuity (Postgres, REPRO-1)
        env:
          DATABASE_URL: postgresql+psycopg://irp:irp@localhost:5432/irp
          IRP_TEST_DATABASE_URL: postgresql+psycopg://irp:irp@localhost:5432/irp
        run: pytest packages/shared-python/tests/test_reproduction_pg.py -q
      - name: Four-eyes entitlement changes + orphan-proofing, concurrent (Postgres, ONBOARD-1b)
        env:
          DATABASE_URL: postgresql+psycopg://irp:irp@localhost:5432/irp
          IRP_TEST_DATABASE_URL: postgresql+psycopg://irp:irp@localhost:5432/irp
        # The concurrency arm runs two real sessions against the per-tenant advisory lock — the
        # orphan invariant's fourth path, which SQLite cannot express at all. Also proves the
        # ENT-075 append-only trigger, which is what caught approval-by-mutation at build time.
        run: pytest packages/shared-python/tests/test_entitlement_admin_pg.py -q
      - name: Tenant registry, boundary + two-context onboarding (Postgres, ONBOARD-1a)
        env:
          DATABASE_URL: postgresql+psycopg://irp:irp@localhost:5432/irp
          IRP_TEST_DATABASE_URL: postgresql+psycopg://irp:irp@localhost:5432/irp
        # Runs as the constrained irp_app role the suite creates for itself: the default irp login
        # is the container superuser (BYPASSRLS), and every RLS assertion here would pass with
        # row-level security switched off. That is not hypothetical — the suite's first draft did
        # exactly that and was caught only by its own rolbypassrls floor.
        run: pytest packages/shared-python/tests/test_tenancy_pg.py -q
      # Floored at 0071 (review fold F-12): 0071's own downgrade under the stage-25 two-measure
      # book correctly refuses (see the full-chain empty-schema smoke earlier in this job for the
      # whole chain's DDL reversibility). A no-op while head IS 0071; every migration 0072+ adds
      # its downgrade-over-data leg here automatically.
      - name: Revert migrations to 0071 (downgrade-over-data smoke)
        env:
          DATABASE_URL: postgresql+psycopg://irp:irp@localhost:5432/irp
        run: alembic downgrade 0071_exposure_type_in_grain_key

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Secret scan (placeholder for gitleaks)
        run: python scripts/secret_scan.py

  sbom:
    name: SBOM (CycloneDX)
    runs-on: ubuntu-latest
    # DEPLOY-1 (2026-08-11), ratified with the proprietary licence position. Diligence asks for a
    # dependency bill of materials before it asks for a chart, and the licence file makes a claim
    # about the dependency tree (psycopg is LGPL-3.0-only and is a RUNTIME dep) that should be
    # mechanically re-derivable rather than hand-maintained.
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install the runtime tree into an ISOLATED environment
        # The scanner must NOT live in the environment it scans. The first version of this job
        # pip-installed cyclonedx-bom alongside the product and then ran `cyclonedx-py environment`
        # over the result — so the SBOM described the TOOL as much as the product, and the copyleft
        # gate below failed CI on `chardet` (LGPL), which is a dependency of cyclonedx-bom itself
        # and of nothing this platform ships. Two separate environments, and the scanner is handed
        # the product interpreter as an argument.
        run: |
          python -m pip install --upgrade pip
          python -m venv /tmp/product-venv
          /tmp/product-venv/bin/pip install --upgrade pip
          # MIRRORS THE DOCKERFILES, not the pyprojects. `psycopg` is declared by NO pyproject —
          # backend/worker/migrate.Dockerfile each install "psycopg[binary]>=3.1" explicitly and
          # say so in a comment (RPT-2). An SBOM built from the pyprojects alone omitted the
          # database driver entirely: 25 components, psycopg absent — i.e. it omitted the ONE
          # dependency carrying a real licence obligation, which is worse than publishing nothing.
          /tmp/product-venv/bin/pip install \
            "./packages/shared-python[deploy]" ./apps/backend ./apps/worker \
            "uvicorn[standard]>=0.30" "psycopg[binary]>=3.1"
          python -m venv /tmp/sbom-venv
          /tmp/sbom-venv/bin/pip install cyclonedx-bom
      - name: Generate the Python SBOM (of the PRODUCT environment)
        run: |
          /tmp/sbom-venv/bin/cyclonedx-py environment /tmp/product-venv/bin/python \
            --output-format JSON --output-file sbom-python.json
      - name: Fail on a copyleft licence the LICENSE file does not already declare
        # The declared exceptions are psycopg/psycopg-binary (LGPL-3.0-only, used unmodified) and
        # certifi/pathspec (MPL-2.0). A NEW copyleft dependency is a licence decision, not a
        # dependency bump, and it must not arrive silently.
        run: |
          python - <<'PY'
          import json, sys
          declared = {"psycopg", "psycopg-binary", "certifi", "pathspec"}
          sbom = json.load(open("sbom-python.json"))
          bad = []
          for c in sbom.get("components", []):
              name = c.get("name", "")
              lic = json.dumps(c.get("licenses", []))
              if any(k in lic.upper() for k in ("GPL", "MPL", "SSPL", "EUPL")) and name not in declared:
                  bad.append((name, lic))
          if bad:
              print("UNDECLARED COPYLEFT DEPENDENCIES:", bad)
              print("Add them to LICENSE's third-party section deliberately, or remove them.")
              sys.exit(1)
          print(f"SBOM: {len(sbom.get('components', []))} components, no undeclared copyleft")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: sbom-python
          path: sbom-python.json

  docs-check:
    name: Documentation check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Documentation consistency (placeholder)
        run: python scripts/check_docs.py
      - name: Capability coverage (strategy -> requirement)
        # Product re-baseline 2026-08-12. Fails when a capability the OWNER's taxonomy declares, or
        # a SCOPE commitment, has no requirement behind it. Every prior audit used the requirement
        # register as its yardstick, which is exactly where the Wave 1-17 drift lived; this gate's
        # inputs are documents the owner wrote. Ratchet: today's gaps are recorded by name in
        # 02_requirements/capability_coverage_baseline.json, only NEW ones fail, and an exemption
        # left in place after it has been paid also fails.
        run: python scripts/check_capability_coverage.py
      - name: G2 adjudication ledger (bookkeeping, NOT quality)
        # Product re-baseline 2026-08-13. G2 was specified as an automated detector — "does this
        # acceptance criterion actually test the business purpose?" — and six independent designs
        # were built and scored against a labelled register. All six caught all three known-bad
        # rows and none is usable: measured by hand on the best performer, an acceptance reading
        # "the rollup is NOT implemented; the endpoint returns 501" PASSED, the register's own
        # 2026-08-12 repair was FLAGGED, and six appended words turned the real defect green.
        # So G2 is a HUMAN act (P20) and this step checks only that the act happened and has not
        # lapsed. It must never be described as a check on requirement quality.
        run: python scripts/check_g2_adjudication.py

  # DEP-1 (Wave-15, OQ-W15P-1): CI BUILDS the three images it has always only tested the source of.
  #
  # The gap this closes (planning F1): three Dockerfiles and a compose file have shipped since the
  # scaffold and CI built NONE of them — measured 0 hits for `docker build` in this file. That is
  # the asymmetry that let an EOL `node:20-slim` base ship unnoticed until FE-M1 caught it by
  # READING, and `frontend.Dockerfile` says so in its own comment: "none of which CI can surface on
  # its own — CI never builds this image."
  #
  # Deliberately MORE than `docker build`. A build proves the Dockerfile parses and its layers run;
  # it does NOT prove the artifact works. This wave's predecessor closed on exactly that distinction
  # — a control's EXISTENCE was verified and its DISCRIMINATING POWER was not — so each image is
  # also made to DO something, and the build-context hygiene finding ships as a permanent control.
  #
  # Build only; publishing to a registry is deliberately out of DEP-1's scope.
  images:
    name: Container images (build + smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build backend image
        run: docker build -f infra/docker/backend.Dockerfile -t irp-backend:ci .
      - name: Build worker image
        run: docker build -f infra/docker/worker.Dockerfile -t irp-worker:ci .
      - name: Build frontend image
        run: docker build -f infra/docker/frontend.Dockerfile -t irp-frontend:ci .

      # The discriminating half: a built image that cannot import its own entrypoint is a green
      # build and a broken deploy. Each check exercises the thing the CMD would actually do.
      - name: Smoke — each image can do its job
        run: |
          set -euo pipefail
          docker run --rm irp-backend:ci python -c "import irp_backend.main"
          docker run --rm irp-worker:ci python -c "import irp_worker.supervisor"
          docker run --rm irp-frontend:ci test -s /usr/share/nginx/html/index.html
          echo "all three images import / serve"

      # The DEP-1 build-context finding, as a permanent control (P9: a refusal is not shipped until
      # a test has made it FIRE — deleting .dockerignore makes this step fail).
      #
      # Found by EXECUTION at DEP-1: with no .dockerignore the backend image carried 34 __pycache__
      # directories off the build machine plus both test suites. Stale local bytecode inside an
      # artifact whose entire purpose is reproducibility is the project's known hazard class.
      - name: Build-context hygiene — no local bytecode, no tests in a production image
        run: |
          set -euo pipefail
          fail=0
          for img in irp-backend:ci irp-worker:ci; do
            pyc=$(docker run --rm "$img" sh -c "find /app -name '__pycache__' -type d 2>/dev/null | wc -l" | tr -d '[:space:]')
            tst=$(docker run --rm "$img" sh -c "find /app -type d -name tests 2>/dev/null | wc -l" | tr -d '[:space:]')
            echo "$img: __pycache__=$pyc tests=$tst"
            if [ "$pyc" != "0" ]; then echo "::error::$img ships $pyc __pycache__ dir(s) — stale build-machine bytecode in a production image (check .dockerignore)"; fail=1; fi
            if [ "$tst" != "0" ]; then echo "::error::$img ships $tst test dir(s) — test code is not production surface (check .dockerignore)"; fail=1; fi
          done
          exit $fail

  # DEP-1 (Wave-15): RUN THE STACK. Not build it — run it.
  #
  # This job exists because of a measured result, not a principle. DEP-1 found ELEVEN defects across
  # five items, and TEN of them were pre-existing: no migration step anywhere in the stack, no
  # container able to run one, a DATABASE_URL unusable from inside a container, the backend racing
  # both Postgres and the migration, the frontend dying because nginx resolves upstreams once at
  # startup, a port collision with the dev database, a header comment stale since migration 0001.
  #
  # A 2,980-test suite caught NONE of them, and no larger suite would have. Every one lived in the
  # space BETWEEN components — image build vs. runtime, container DNS, compose ordering, env
  # resolution — and tests exercise code paths without ever starting the system. The compose file
  # drifted from migration 0001 to 0062 carrying a header claiming the app has no schema, because
  # nothing ran it.
  #
  # Both scripts are executable and were, until this job, MANUAL — the exact kind of thing that
  # rots. They are self-contained by construction: each generates its env from the committed
  # `.env.example` (so no CI secret is needed and no developer `.env` can leak in), and each uses
  # its own compose project and host port, so they cannot collide with each other.
  stack-proof:
    name: Stack proof (deploy + backup/restore)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Toolchain
        run: docker compose version

      # Builds the images through compose, starts an EMPTY database, migrates + seeds through the
      # governed prepare step (twice — idempotency is a deployment property or it is nothing), then
      # verifies by READING DEPLOYED DATABASE STATE and reaching the running services. It does not
      # report success because its last command exited 0.
      - name: Deploy to a clean stack, and verify the deployment
        run: bash infra/deploy/deploy.sh

      # Both arms. The NEGATIVE one is the point: a truncated archive must be REFUSED, and the
      # target database must be UNCHANGED afterwards. A restore that "succeeds" on a damaged dump
      # converts a recoverable outage into confident data loss; a restore that fails HALFWAY has
      # already dropped what it was replacing. The proof asserts the refusal lands before the
      # target is touched (P9: a refusal is not shipped until a test has made it FIRE).
      - name: Prove backup AND restore — including the refusal
        run: bash infra/deploy/prove_backup_restore.sh

      # RPT-1, I2's restore-cycle arm. The unit tier proves generate -> regenerate is byte-identical
      # inside one process; this proves it ACROSS a pg_dump round-trip, a destroyed schema, a
      # restore and a fresh interpreter — and compares against a hash captured before the archive
      # existed, so a backup that faithfully preserved a wrong value cannot satisfy it.
      # RPT-2 extends the same proof with the HTTP arm (remit I6/P15): the restored stack SERVES
      # the report over the wire byte-identically, the entitlement fence holds live (401/403/the
      # view-cannot-generate split), and the wire cannot assert evidence time (422). One script,
      # one stack, both invariant families.
      - name: Prove a governed report regenerates identically after a restore (I2) + serves over HTTP (I6)
        run: bash infra/deploy/prove_report_identity.sh

      # REPRO-1: CTRL-018's OBSERVED scheduled green — and the first execution ANYWHERE of the
      # deployed worker's database path (RPT-2 carry b: deploy.sh only ever proved the worker's
      # bounded idle proof, because an empty IRP_TENANT_IDS now means 'no restriction' and a
      # fresh registry has no tenants — REPRO-2). A real tick, through the real
      # scheduler, re-derives a governed report from its pinned inputs. Both arms go through the
      # worker: the second schedule exists so a PLANTED divergence gets its own tick bucket and the
      # failure path is executed rather than assumed.
      - name: Prove the IGNITION — a tenant created over HTTP, its first admin resolves (ONBOARD-1a)
        run: ./infra/deploy/prove_onboarding.sh
      - name: Prove a scheduled reproduction detects a planted divergence (CTRL-018)
        run: bash infra/deploy/prove_reproduction.sh

      - name: Leave nothing behind
        if: always()
        run: |
          docker compose -p irp-dep1 down -v --remove-orphans 2>/dev/null || true
          docker compose -p irp-dep1-br down -v --remove-orphans 2>/dev/null || true
          docker compose -p irp-rpt1-id down -v --remove-orphans 2>/dev/null || true
          docker compose -p irp-repro1 down -v --remove-orphans 2>/dev/null || true
