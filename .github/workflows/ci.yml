name: CI

# Enforces the ratified Step 1A–1C standards from the first commit.
# Any failing step fails its job and blocks the merge.

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e packages/shared-python -e apps/backend -e apps/worker
      # API-1b (OQ-W9C-4): the first Python-runtime dependency-advisory gate — parity with the npm
      # production audit, added when pyjwt/cryptography became the identity-verification surface. Hard
      # fail-on-any. Audits the INSTALLED ENVIRONMENT (runs AFTER the editable installs above), NOT
      # `-r requirements-dev.txt` — the latter misses runtime pins declared only in a package's
      # pyproject.toml (e.g. python-multipart, the /ingest/upload form-parse surface), which would
      # slip the gate (review finding A1). The three first-party editable packages skip cleanly (not
      # on PyPI). --ignore-vuln PYSEC-2026-1845 is a DEV-ONLY pytest advisory whose fix is a risky
      # 8->9 major bump, disclosed + deferred to its own hygiene slice (never in the shipped tree).
      # RETRY (FE-3b hardening): pip-audit fetches the OSV/PyPI advisory DB live, so a transient
      # service blip fails the whole job on an unchanged tree (bit run #492 — a docs-only commit red
      # while the same audit passed clean 13 min later). One retry after a 60s pause absorbs the
      # blip; a REAL advisory still fails both attempts, so the gate keeps its teeth.
      - name: Python dependency audit
        run: pip-audit --ignore-vuln PYSEC-2026-1845 || (echo "pip-audit failed — retrying once in 60s (transient advisory-service check)" && sleep 60 && pip-audit --ignore-vuln PYSEC-2026-1845)
      - name: Ruff format check
        run: ruff format --check .
      - name: Ruff lint
        run: ruff check .
      - name: Mypy
        run: mypy
      - name: Pytest
        run: pytest

  frontend:
    name: Frontend (TypeScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24" # active LTS (Node 20 EOL 2026-04); TC-1 / OD-TC-1-C
      - name: Install dependencies (reproducible from lockfile)
        run: npm ci
      - name: Runtime-dependency audit (production tree only — TC-1 / OD-TC-1-D; tightened high→moderate at the Wave-1 close, OQ-W1C-4; time-bound reachability-justified allowlist in audit-allowlist.json)
        run: node scripts/check_frontend_audit.mjs
      - name: Shared package tests
        run: npm run -w packages/shared-ts test
      - name: Lint
        run: npm run -w apps/frontend lint
      - name: Typecheck
        run: npm run -w apps/frontend typecheck
      - name: Format check
        run: npm run -w apps/frontend format:check
      - name: Test
        run: npm run -w apps/frontend test
      - name: Build
        run: npm run -w apps/frontend build

  api-type-drift:
    name: API type drift (OpenAPI → TS)
    # FE-2 / OD-FE-2-A: regenerate the committed openapi.json + api-types.d.ts and fail on any diff,
    # so a backend DTO change not reflected in the generated FE types turns this RED (the FL-1
    # hand-mirror drift class becomes un-mergeable). Needs BOTH Python (app.openapi() dump) and Node
    # (openapi-typescript) — the Frontend job is Node-only, so this is its own job.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - name: Install backend (for app.openapi())
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e packages/shared-python -e apps/backend
      - name: Install frontend deps (for openapi-typescript)
        run: npm ci
      - name: Regenerate the schema + the generated types
        run: |
          python scripts/dump_openapi.py
          npm run -w apps/frontend gen:types
      - name: Fail on drift (regenerated artifacts must match the committed ones)
        run: git diff --exit-code apps/frontend/openapi.json apps/frontend/src/api/generated

  migration:
    name: DB migration (Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: irp
          POSTGRES_USER: irp
          # Ephemeral CI-only service credential (not an application secret).
          POSTGRES_PASSWORD: irp
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U irp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          # The PostgreSQL tier spans all three packages: several suites exercise the WORKER
          # tick and the BACKEND router against a real database (function-local imports of
          # irp_worker / irp_backend). Installing only shared-python made those suites fail
          # to collect with ModuleNotFoundError — which stayed invisible while they were
          # absent from CI, and surfaced the moment the CI-parity slice added them.
          pip install -e packages/shared-python -e apps/backend -e apps/worker "psycopg[binary]"
      - name: Apply migrations (foundation + entitlement seed)
        env:
          DATABASE_URL: postgresql+psycopg://irp:irp@localhost:5432/irp
        run: alembic upgrade head
      - name: Schema drift check (models vs migrations, OD-052)
        env:
          DATABASE_URL: postgresql+psycopg://irp:irp@localhost:5432/irp
        run: alembic check
      # STRUCT-1 (review fold F-12): the FULL-CHAIN downgrade smoke moved here, onto the still-
      # empty schema, because it can no longer run at the end of the job: from 0071 on, a
      # downgrade below 0071 over a book carrying two exposure measures is a REFUSED data-loss
      # operation by design (narrowing the key under multi-measure rows; the append-only trigger
      # forbids the row-deleting alternative), and stage 25 seeds exactly such a book. The end-of-
      # job smoke survives, floored at 0071, so future migrations' downgrade legs still run over
      # the fully seeded book.
      - name: Revert migrations (full-chain downgrade smoke, empty schema)
        env:
          DATABASE_URL: postgresql+psycopg://irp:irp@localhost:5432/irp
        run: |
          alembic downgrade base
          alembic upgrade head
      - name: Audit-write concurrency test (Postgres, BR-18 / OD-051)
        env:
          DATABASE_URL: postgresql+psycopg://irp:irp@localhost:5432/irp
          IRP_TEST_DATABASE_URL: postgresql+psycopg://irp:irp@localhost:5432/irp
        run: pytest packages/shared-python/tests/test_audit_concurrency.py -q
      - name: PERF-0 scale-probe smoke (Postgres — CORRECTNESS only, no timing budget)
        env:
          DATABASE_URL: postgresql+psycopg://irp:irp@localhost:5432/irp
          IRP_TEST_DATABASE_URL: postgresql+psycopg://irp:irp@localhost:5432/irp
        # Tiny rung. Proves the harness still drives all SIX chain segments end-to-end and that
        # each mints a COMPLETED governed run. Asserts NO wall-clock: CI hardware is noisy shared
        # infrastructure, and a timing gate here would be flaky and teach people to ignore it
        # (OQ-PERF-0-4). Budgets are checked against readings taken on a quiet machine.
        run: pytest packages/shared-python/tests/test_perf_probe_pg.py -q
      - name: Tenant-context RLS tests (Postgres, AD-016 / AD-015 / BR-17)
        env:
          DATABASE_URL: postgresql+psycopg://irp:irp@localhost:5432/irp
          IRP_TEST_DATABASE_URL: postgresql+psycopg://irp:irp@localhost:5432/irp
        run: pytest packages/shared-python/tests/test_tenant_context_pg.py -q
      - name: Deployed application-role RLS tests (Postgres, DEPLOY-1 — the role the deploy uses)
        # The CI-parity gate caught this suite shipping with no CI step, which is the correct
        # catch: a test proving the DEPLOYED role cannot cross tenants is worth nothing if only
        # the author's laptop ever runs it. That is the whole shape of the defect this slice
        # exists to fix — an isolation proof that was true of a role nothing deployed used.
        env:
          DATABASE_URL: postgresql+psycopg://irp:irp@localhost:5432/irp
          IRP_TEST_DATABASE_URL: postgresql+psycopg://irp:irp@localhost:5432/irp
        run: pytest packages/shared-python/tests/test_app_role_pg.py -q
      - name: OIDC tenant-claim canonicalization RLS test (Postgres, SSO-1 / AD-007 / BR-17)
